<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Trip plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f6f3ec;--card:#fffdf8;--ink:#15324d;--ink-soft:#4a5763;--line:#e2dccf;--navy:#15324d;--teal:#2e7d74}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#15324d,#1c4260 55%,#236b63);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);padding:24px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:380px;width:100%;
    padding:34px 30px 30px;box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center}
  .lock{width:46px;height:46px;margin:0 auto 14px;color:var(--teal)}
  .lock svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:22px;margin:0 0 6px;color:var(--navy)}
  p.sub{font-size:14px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5}
  input{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--paper);color:var(--ink);margin-bottom:12px}
  input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,125,116,.18)}
  button{width:100%;font-size:15px;font-weight:600;padding:12px;border:none;border-radius:999px;
    background:var(--navy);color:#fff;cursor:pointer}
  button:hover{opacity:.93}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#9c3b2e;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
  <form class="box" id="f">
    <div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>Our trip plan</h1>
    <p class="sub">This page is private. Enter the password to open it.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
    <button id="b" type="submit">Open plan</button>
    <div class="err" id="err"></div>
  </form>

const b64d = function(s){return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0)});};
async function unlock(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(P.salt), iterations:P.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct));
  return new TextDecoder().decode(pt);
}

    const html = await unlock(document.getElementById('pw').value);
    document.open(); document.write(html); document.close();

    btn.disabled = false; btn.textContent = 'Open plan';
    document.getElementById('pw').select();

});
