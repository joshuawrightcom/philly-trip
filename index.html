<style>
  :root{
    --paper:#f6f3ec;
    --card:#fffdf8;
    --ink:#15324d;
    --ink-soft:#4a5763;
    --line:#e2dccf;
    --navy:#15324d;
    --teal:#2e7d74;
    --brick:#9c3b2e;
    --gold:#b07e1e;
    --shadow:0 1px 2px rgba(21,50,77,.06),0 8px 24px rgba(21,50,77,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;
  }
  .gate{display:grid;grid-template-columns:1.04fr .96fr;min-height:100vh;min-height:100dvh}

  /* ---------- Photograph ---------- */
  .plate{position:relative;margin:0;background:var(--navy);overflow:hidden}
  .plate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
  .plate::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(160deg,rgba(21,50,77,.30) 0%,rgba(28,66,96,.14) 45%,rgba(35,107,99,.30) 100%),
      linear-gradient(to top,rgba(21,50,77,.86) 0%,rgba(21,50,77,0) 36%);
  }
  .plate figcaption{
    position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 32px 26px;
    color:rgba(246,243,236,.74);font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;font-weight:600;line-height:1.75;
  }
  .plate figcaption b{display:block;color:rgba(246,243,236,.95);font-weight:700}

  /* ---------- Form side ---------- */
  .panel{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:52px 40px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:34px 32px 30px;width:100%;max-width:392px;
  }
  .lock{width:42px;height:42px;color:var(--teal);margin-bottom:16px}
  .lock svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .eyebrow{
    display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    font-weight:700;color:var(--teal);margin-bottom:6px;
  }
  h1{
    font-family:"Fraunces",Georgia,serif;font-weight:600;
    font-size:clamp(27px,3.2vw,34px);line-height:1.1;letter-spacing:-.01em;
    margin:0 0 10px;color:var(--navy);
  }
  .sub{font-size:15px;color:var(--ink-soft);margin:0 0 24px}
  form{margin:0}
  label{
    display:block;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:700;color:var(--ink-soft);margin-bottom:8px;
  }
  input{
    width:100%;font-family:inherit;font-size:16px;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:16px;
  }
  input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,125,116,.18)}
  button{
    width:100%;font-family:inherit;font-size:15px;font-weight:600;
    padding:13px 18px;border:none;border-radius:999px;
    background:var(--navy);color:#fff;cursor:pointer;transition:opacity .16s;
  }
  button:hover{opacity:.92}
  button:disabled{opacity:.6;cursor:default}
  .err{min-height:20px;margin:12px 0 0;font-size:13.5px;line-height:1.5;color:var(--brick)}
  .fine{
    margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line);
    font-size:12.5px;line-height:1.6;color:var(--ink-soft);
  }

  /* ---------- Responsive ---------- */
  @media (max-width:860px){
    .gate{grid-template-columns:1fr;min-height:0}
    .plate{height:38vh;min-height:236px}
    .plate img{object-position:50% 44%}
    .plate figcaption{padding:0 22px 18px;font-size:10px}
    .panel{padding:26px 18px 44px;min-height:62dvh;align-items:flex-start}
    .card{max-width:440px;padding:28px 24px 26px}
    h1{font-size:clamp(25px,6.6vw,31px)}
  }
  @media (max-width:860px) and (max-height:620px){
    .plate{height:30vh;min-height:168px}
  }
</style>

const b64d = function(s){return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0)});};
async function unlock(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(P.salt), iterations:P.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct));
  return new TextDecoder().decode(pt);
}
